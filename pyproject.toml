[project]
name = "stechdrive-3dgs-utils"
version = "1.25.5"
description = "Studio toolkit for preparing 360 video assets for SfM and 3DGS training."
requires-python = ">=3.12"

[tool.stechdrive-3dgs-utils]
core-requirements = "requirements/core.txt"
torch-requirements = "requirements/torch-cu128.txt"
ml-requirements = "requirements/ml.txt"
test-requirements = "requirements/test.txt"

[tool.ruff]
target-version = "py312"
line-length = 120
exclude = [
    ".cache",
    ".venv",
    ".venv-*",
    "models",
]

[tool.ruff.lint]
select = [
    "E4",
    "E7",
    "E9",
    "F",
    "I",
    "B",
    "UP",
]
ignore = [
    "E501",
]
